name: Prova con dati veri (senza Discord)

# Si lancia cambiando prova.txt: calcola la lista di oggi con i dati Yahoo veri in data/prove/ (cartella a parte),
# senza toccare la lista pubblica, il giornale o Discord, e salva il risultato nel repo per controllarlo.
on:
  push:
    paths:
      - "prova.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeff-coach-data
  cancel-in-progress: false

env:
  JEFF_COACH_HOME: ${{ github.workspace }}/data/prove
  PYTHONUTF8: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lista di prova
        run: |
          S=$(python -c "from jeffcoach.calendar_us import today_rome,is_session,next_session;d=today_rome();print(d if is_session(d) else next_session(d))")
          python -m jeffcoach.daily --session $S 2>&1 | tail -40 | tee data/prove/ultimo_log.txt || true
      - name: Commit
        if: always()
        run: |
          git config user.name "jeff-coach-bot"
          git config user.email "jeff-coach-bot@users.noreply.github.com"
          git add -A data/prove
          git diff --cached --quiet && exit 0
          git commit -m "Prova con dati veri"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
