name: Alert turno A (fino alle 19:00 Roma)

# Manda dall'apertura delle 09:30 di New York (15:30 Roma) fino alla barra delle 13:00 (19:00 Roma).
# Parte alle 09:15 di New York per essere pronto all'apertura (installazione e dati: 1-2 minuti).
# 13:15 / 14:15 UTC: con l'ora legale USA parte il primo (09:15 NY), con l'ora solare il secondo
# (09:15 NY: il primo esce perché troppo presto). 13:35 / 14:35 UTC sono la riserva se GitHub ne salta
# uno: escono subito se il turno è già attivo.
on:
  schedule:
    - cron: "15 13 * * 1-5"
    - cron: "35 13 * * 1-5"
    - cron: "15 14 * * 1-5"
    - cron: "35 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  turno:
    uses: ./.github/workflows/_alert.yml
    with:
      turno: A
    secrets: inherit
