name: Pre-market

# Riserva del server (08:50 New York): 09:10 New York = 13:10 UTC (ora legale USA) / 14:10 UTC (ora solare).
# Lo script controlla l'ora di New York ed esce se il pre-market è già fatto.
on:
  # [sospeso 27/10, Andrea] cron su GitHub fermo: lo fa il server Oracle. Si lancia ancora a mano (Run workflow).
  # schedule:
  #   - cron: "10 13 * * 1-5"
  #   - cron: "10 14 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Anche fuori finestra"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jeff-coach-data
  cancel-in-progress: false

env:
  JEFF_COACH_HOME: ${{ github.workspace }}/data
  COACH_ALERT_DISCORD_WEBHOOK_URL: ${{ secrets.COACH_ALERT_DISCORD_WEBHOOK_URL }}
  PYTHONUTF8: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then python -m jeffcoach.premarket --force; else python -m jeffcoach.premarket; fi
      - name: Commit
        if: always()
        run: |
          git config user.name "jeff-coach-bot"
          git config user.email "jeff-coach-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "Premarket"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
