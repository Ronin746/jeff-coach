name: Market Monitor nostro

# Copia del workflow di Martin-coach. Replica del Market Monitor di Stockbee sull'universo completo (~5.700 azioni USA) [RONIN 15/10].
# Ogni notte alle 00:00 di Roma dopo una seduta USA (Andrea: chiusura giornaliera sicuramente completa).
# GitHub ragiona in UTC: due orari (22:00 UTC = mezzanotte con l'ora legale, 23:00 UTC = mezzanotte con l'ora
# solare); parte il primo che cade tra le 00:00 e le 03:00 di Roma, solo dopo una seduta e una volta sola.
# Scrive data/breadth/market_monitor_full.json e la calibrazione su Stockbee; la lista la usa solo se
# Stockbee, NEL e l'archivio non hanno la riga del giorno.
on:
  schedule:
    - cron: "0 22 * * 1-5"
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeff-coach-data
  cancel-in-progress: false

env:
  JEFF_COACH_HOME: ${{ github.workspace }}/data
  PYTHONUTF8: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(python -m jeffcoach.breadth orario)" != "si" ]; then
            echo "non è mezzanotte a Roma o niente seduta: salto"; exit 0
          fi
          python -m jeffcoach.breadth completo
      - name: Commit
        if: always()
        run: |
          git config user.name "jeff-coach-bot"
          git config user.email "jeff-coach-bot@users.noreply.github.com"
          git add -A data/breadth
          git diff --cached --quiet && exit 0
          git commit -m "Market Monitor nostro"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
