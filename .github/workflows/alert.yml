name: Alert in seduta (Sydney e Remy)

# Fa in cloud quello che fa avvia.py sul PC: alert di Sydney (ingresso, RVOL, canale), scanner di Remy ogni
# barra da 5 minuti e sync delle watchlist di Remy alle 15:00 di Roma.
#
# Turni: un lavoro GitHub dura al massimo 6 ore e la seduta 6 ore e mezza. Il turno A parte prima
# dell'apertura e dopo 335 minuti, se la seduta non è finita, fa partire il turno B e gli passa lo stato
# (cache). Il turno B finisce 5 minuti dopo la chiusura. Chiusure anticipate e festività come sul PC.
#
# 13:05 UTC = 15:05 Roma con l'ora legale USA, 14:05 con l'ora solare (aspetta l'apertura).
# 13:40 UTC = riserva se GitHub salta il primo: esce subito se c'è già un turno attivo.
#
# Prova o dal vivo: finché la variabile del repo CLOUD_ALERT_LIVE non vale "true", i messaggi vanno a un
# finto Discord interno (cloud/sink.py) e finiscono in data/cloud/AAAA-MM-GG.jsonl. Dal vivo servono i
# secrets COACH_ALERT_DISCORD_WEBHOOK_URL (Sydney) e REMY_DISCORD_WEBHOOK_URL (Remy).
on:
  schedule:
    - cron: "5 13 * * 1-5"
    - cron: "40 13 * * 1-5"
  push:
    branches: [main]
    paths: ["cloud/prova.txt"]
  workflow_dispatch:
    inputs:
      parte:
        description: "A = turno normale, B = secondo turno, prova = un giro e basta"
        default: "A"

permissions:
  contents: write
  actions: write

env:
  PYTHONUTF8: "1"
  AVVIA_LOG_STDOUT: "1"
  COACH_ALERT_DISCORD_WEBHOOK_URL: ${{ vars.CLOUD_ALERT_LIVE == 'true' && secrets.COACH_ALERT_DISCORD_WEBHOOK_URL || 'http://127.0.0.1:8765/sydney' }}
  DISCORD_WEBHOOK_URL: ${{ vars.CLOUD_ALERT_LIVE == 'true' && secrets.REMY_DISCORD_WEBHOOK_URL || 'http://127.0.0.1:8765/remy' }}

jobs:
  turno:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Quale turno
        id: m
        run: |
          P="${{ github.event.inputs.parte }}"; [ -z "$P" ] && P=A
          [ "${{ github.event_name }}" = "push" ] && P=prova
          echo "parte=$P" >> "$GITHUB_OUTPUT"
          echo "oggi=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
          echo "Turno $P — dal vivo: ${{ vars.CLOUD_ALERT_LIVE == 'true' }}"
      - name: Un solo turno alla volta
        id: g
        if: steps.m.outputs.parte != 'prova'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          altri() { gh run list -R "$GITHUB_REPOSITORY" -w alert.yml -s in_progress --json databaseId \
                     -q "[.[] | select(.databaseId != ${{ github.run_id }})] | length"; }
          if [ "${{ steps.m.outputs.parte }}" = "B" ]; then
            # il turno A sta finendo (salva lo stato): aspetto al massimo 10 minuti
            for i in $(seq 1 40); do [ "$(altri)" = "0" ] && break; sleep 15; done
            echo "vai=true" >> "$GITHUB_OUTPUT"
          elif [ "$(altri)" != "0" ]; then
            echo "C'è già un turno attivo: esco"; echo "vai=false" >> "$GITHUB_OUTPUT"
          else
            echo "vai=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.g.outputs.vai != 'false'
        with:
          python-version: "3.13"
          cache: pip
      - if: steps.g.outputs.vai != 'false'
        run: pip install -r requirements.txt -r tv-scanner/requirements.txt
      - uses: actions/cache/restore@v4
        if: steps.g.outputs.vai != 'false'
        with:
          path: |
            dati/state/alerts
            dati/remy_sync_ultimo.txt
            tv-scanner/signal_state.json
            tv-scanner/last_signals.md
          key: alert-state-${{ steps.m.outputs.oggi }}-${{ github.run_id }}
          restore-keys: |
            alert-state-${{ steps.m.outputs.oggi }}-
            alert-state-
      - name: Sydney e Remy
        id: run
        if: steps.g.outputs.vai != 'false'
        run: |
          nohup python cloud/sink.py > /tmp/sink.log 2>&1 &
          sleep 1
          set +e
          if [ "${{ steps.m.outputs.parte }}" = "prova" ]; then
            python avvia.py --once
          else
            python avvia.py --fino-chiusura --max-minuti 335
          fi
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" = "0" ] || [ "$rc" = "3" ] || exit "$rc"
      - name: Registro
        if: always() && steps.g.outputs.vai != 'false'
        run: |
          echo "### Turno ${{ steps.m.outputs.parte }} ${{ steps.m.outputs.oggi }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f cloud/sink_out.jsonl ]; then
            echo "Messaggi (finto Discord): $(wc -l < cloud/sink_out.jsonl)" >> "$GITHUB_STEP_SUMMARY"
            mkdir -p data/cloud && cat cloud/sink_out.jsonl >> "data/cloud/${{ steps.m.outputs.oggi }}.jsonl"
          fi
          tail -n 60 logs/remy.log 2>/dev/null || true
      - uses: actions/cache/save@v4
        if: always() && steps.g.outputs.vai != 'false' && steps.m.outputs.parte != 'prova'
        with:
          path: |
            dati/state/alerts
            dati/remy_sync_ultimo.txt
            tv-scanner/signal_state.json
            tv-scanner/last_signals.md
          key: alert-state-${{ steps.m.outputs.oggi }}-${{ github.run_id }}
      - name: Commit (watchlist di Remy e registro della prova)
        if: always() && steps.g.outputs.vai != 'false'
        run: |
          git config user.name "jeff-coach-bot"
          git config user.email "jeff-coach-bot@users.noreply.github.com"
          git add tv-scanner/pivot_wl_*.txt data/cloud 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Alert cloud ${{ steps.m.outputs.oggi }} turno ${{ steps.m.outputs.parte }}"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
      - name: Secondo turno
        if: steps.run.outputs.rc == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run alert.yml -R "$GITHUB_REPOSITORY" --ref main -f parte=B
